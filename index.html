<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>你的内在猫格原型测试 | 24猫格形象测试</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto+Sans+SC', sans-serif;
            background-color: #f8fafc;
        }
        .cat-gradient {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
        }
        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .option-btn:hover {
            transform: scale(1.02);
            transition: all 0.2s ease;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Start Screen -->
    <div id="start-screen" class="max-w-2xl w-full bg-white rounded-3xl shadow-2xl overflow-hidden fade-in">
        <div class="cat-gradient p-8 text-white text-center">
            <h1 class="text-4xl font-bold mb-4">你的内在猫格原型</h1>
            <p class="text-lg opacity-90">基于“大五人格”与“依恋理论”改编</p>
        </div>
        <div class="p-8 text-center">
            <p class="text-gray-600 mb-8 leading-relaxed">
                人类的人格特质与猫的生存策略高度相似。<br>
                本测试通过行为选择，定位你在 24 种独特的“猫格”中的位置。<br>
                准备好发现你内心深处住着哪只小猫了吗？
            </p>
            <button id="start-btn" class="cat-gradient text-white px-12 py-4 rounded-full text-xl font-bold shadow-lg hover:opacity-90 transition-opacity">
                开始测试
            </button>
        </div>
    </div>

    <!-- Quiz Screen -->
    <div id="quiz-screen" class="max-w-2xl w-full bg-white rounded-3xl shadow-2xl overflow-hidden hidden fade-in">
        <div class="h-2 w-full bg-gray-100">
            <div id="progress-bar" class="h-full cat-gradient transition-all duration-300" style="width: 0%"></div>
        </div>
        <div class="p-8">
            <div class="flex justify-between items-center mb-6">
                <div class="flex items-center">
                    <button id="back-btn" class="mr-3 p-2 text-gray-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-full transition-colors hidden" title="返回上一题">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    </button>
                    <span id="question-number" class="text-indigo-600 font-bold text-lg">第 1/15 题</span>
                </div>
                <span class="text-gray-400 text-sm">点击选项进入下一题</span>
            </div>
            <h2 id="question-text" class="text-2xl font-bold text-gray-800 mb-8 min-h-[4rem]">
                题目加载中...
            </h2>
            <div id="options-container" class="space-y-4">
                <!-- Options will be injected here -->
            </div>
        </div>
    </div>

    <!-- Result Screen -->
    <div id="result-screen" class="max-w-2xl w-full bg-white rounded-3xl shadow-2xl overflow-hidden hidden fade-in">
        <div class="cat-gradient p-8 text-white text-center">
            <p class="text-sm uppercase tracking-widest opacity-80 mb-2">测试结果</p>
            <h2 class="text-2xl opacity-90 mb-1">你的内在猫格是</h2>
            <h1 id="result-cat-name" class="text-5xl font-black mb-2">缅因巨人</h1>
            <p id="result-cat-title" class="text-xl font-medium opacity-90">温柔领袖</p>
        </div>
        <div class="p-8">
            <div class="mb-8 p-6 bg-indigo-50 rounded-2xl border border-indigo-100">
                <h3 class="text-indigo-800 font-bold mb-2 flex items-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
                    心理依据
                </h3>
                <p id="result-psych" class="text-gray-700 leading-relaxed">加载中...</p>
            </div>
            
            <div class="mb-8">
                <h3 class="text-gray-800 font-bold mb-3">性格特质</h3>
                <p id="result-traits" class="text-gray-600 leading-relaxed">加载中...</p>
            </div>

            <div class="mb-8 p-6 bg-purple-50 rounded-2xl border border-purple-100 italic text-center">
                <h3 class="text-purple-800 font-bold mb-2 not-italic">准确的一句话</h3>
                <p id="result-zapping" class="text-purple-900 text-lg">“加载中...”</p>
            </div>

            <button id="restart-btn" class="w-full py-4 border-2 border-indigo-600 text-indigo-600 rounded-full text-xl font-bold hover:bg-indigo-50 transition-colors">
                重新测试
            </button>
        </div>
        <div class="p-4 bg-gray-50 text-center text-xs text-gray-400">
            基于大五人格模型与依恋理论构建 | 仅供参考
        </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
